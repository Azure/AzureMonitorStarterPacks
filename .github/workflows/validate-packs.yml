name: Validate Packs Definition

on:
  pull_request:
    paths:
      - 'Packs/PacksDef.json'
      - 'Packs/PacksDef.schema.json'
      - 'tools/Validate-PacksDef.ps1'
  push:
    paths:
      - 'Packs/PacksDef.json'
      - 'Packs/PacksDef.schema.json'
      - 'tools/Validate-PacksDef.ps1'

jobs:
  validate-packs:
    name: Validate PacksDef.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PacksDef.json against schema
        shell: pwsh
        run: ./tools/Validate-PacksDef.ps1
